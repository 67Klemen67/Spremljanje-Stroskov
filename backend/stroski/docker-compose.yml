version: '3.8'
services:
  postgres-db:
    image: postgres:latest
    container_name: stroski-postgres
    environment:
      POSTGRES_USER: stroski_user
      POSTGRES_PASSWORD: stroski_password
      POSTGRES_DB: stroski_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: